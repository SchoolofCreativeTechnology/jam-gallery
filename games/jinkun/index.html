<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dodge</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
    /* The ship is flown by dragging too. Without this the browser may claim the drag as a page pan or zoom and
       the ship stops responding mid-touch. */
    canvas { touch-action: none; }
    #file-warning { position: fixed; inset: 0; display: grid; place-items: center; padding: 2rem;
      color: #fff; background: #111; font: 18px/1.5 system-ui, sans-serif; text-align: center; }
    #file-warning[hidden] { display: none; }
    code { background: #333; padding: 0.1em 0.4em; border-radius: 4px; }
    /* Plain overlay text: the title screen and the crash message. */
    #overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 1rem;
      white-space: pre-line; text-align: center; color: #f2f5f9; text-shadow: 0 2px 10px #000;
      font: 20px/1.6 system-ui, sans-serif; pointer-events: none; }
    #overlay[hidden] { display: none; }
    /* The highlighted world in the title picker. */
    #overlay .sel { color: #ffd479; font-weight: 700; }
    /* M2 HUD: plain bars and plain text, top left, in the same flat style as the overlay. ui.js fills these. */
    #hud { position: fixed; top: 18px; left: 18px; width: 268px; color: #f2f5f9;
      text-shadow: 0 2px 8px #000; font: 15px/1.5 system-ui, sans-serif; pointer-events: none; }
    #hud[hidden] { display: none; }
    #hud .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    #hud .label { width: 46px; color: #c9d3de; }
    #hud .bar { flex: 1; display: block; height: 14px; border: 1px solid #7f8b99; background: rgba(0, 0, 0, 0.35); }
    #hud .fill { display: block; height: 100%; width: 0; background: #ffd479; }
    #hud .pips { flex: 1; display: flex; gap: 5px; }
    #hud .pip { width: 20px; height: 14px; border: 1px solid #7f8b99; background: rgba(0, 0, 0, 0.35); }
    #hud .pip.on { background: #dce3ec; }
    #hud .value { width: 58px; text-align: right; }
    #hud .note { margin-top: 9px; color: #9fb0c2; font-size: 13px; }
    /* The altitude and scan-rate readout along the bottom: the numbers the trade is tuned with. */
    #readout { position: fixed; left: 0; right: 0; bottom: 14px; text-align: center; color: #f2f5f9;
      text-shadow: 0 2px 8px #000; font: 16px/1.4 system-ui, sans-serif; pointer-events: none; }
    #readout[hidden] { display: none; }
    /* The frame-rate readout, only shown when the game is opened with ?fps: a check on how much detail the
       scene can carry. ui.js creates it. */
    #fps { position: fixed; top: 18px; right: 18px; color: #f2f5f9; text-shadow: 0 2px 8px #000;
      font: 15px/1.4 system-ui, sans-serif; pointer-events: none; }
    #fps[hidden] { display: none; }
    /* The reward badge, bottom right: four quarters of a gold medal, one lit per world surveyed. badge.js draws
       it; pointer-events must stay off so it never swallows a click meant for flying the ship. */
    #badge { position: fixed; right: 18px; bottom: 18px; width: 112px; height: 112px; pointer-events: none; }
    #badge[hidden] { display: none; }
    /* The red flash on a hit: a flat wash, faded out by ui.js. */
    #flash { position: fixed; inset: 0; pointer-events: none; background: #ff2d1a; opacity: 0; }
    /* The survey report: the world, its findings and its habitability percentage. */
    #report { position: fixed; inset: 0; display: grid; place-items: center; padding: 1rem;
      white-space: pre-line; text-align: center; color: #f2f5f9; text-shadow: 0 2px 10px #000;
      font: 20px/1.6 system-ui, sans-serif; pointer-events: none; }
    #report[hidden] { display: none; }
  </style>
  <!-- three.js comes from a CDN, pinned to one version. No install needed. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="file-warning" hidden>
    <p>This game needs a local server.<br>
      In this folder run <code>python3 -m http.server 8000 --bind 127.0.0.1</code><br>
      (Windows: <code>py -m http.server 8000 --bind 127.0.0.1</code>, or <code>python</code> instead of <code>py</code>)<br>
      then open <a href="http://localhost:8000" style="color:#8cf">http://localhost:8000</a></p>
  </div>
  <script>
    // Browsers block game code opened straight from a file. Say so instead of showing a blank page.
    if (location.protocol === 'file:') document.getElementById('file-warning').hidden = false;
  </script>
  <!-- If three.js (from the internet) or main.js fails to load, say so instead of showing a blank page. -->
  <script type="module" src="./main.js" onerror="if(location.protocol!=='file:'){var w=document.getElementById('file-warning');w.textContent='The game could not load (check your internet), then refresh the page.';w.hidden=false}"></script>
</body>
</html>
